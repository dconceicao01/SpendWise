name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Diagnose E2E formatting
        working-directory: frontend
        run: |
          pnpm exec prettier --write e2e/spendwise.spec.ts
          git --no-pager diff -- e2e/spendwise.spec.ts

      - name: Check formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Unit and component tests
        working-directory: frontend
        run: pnpm test

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser end-to-end and accessibility checks
        working-directory: frontend
        run: pnpm test:e2e

      - name: Build web application
        working-directory: frontend
        run: pnpm build:web

      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  backend-and-database:
    name: Backend, Supabase and container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Database/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install database tooling
        working-directory: Database
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        working-directory: Database
        run: |
          if ! pnpm exec supabase start --workdir . > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error::Local Supabase failed to start; its generated credentials were suppressed from the log."
            exit 1
          fi

      - name: Apply migrations and run pgTAP
        working-directory: Database
        run: |
          pnpm exec supabase db reset --workdir .
          pnpm exec supabase db test --workdir .

      - name: Verify backend and local Auth/RLS integration
        shell: bash
        run: |
          set -euo pipefail
          cd Database
          status="$(pnpm exec supabase status --workdir . --output env)"
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              API_URL) api_url="$value" ;;
              PUBLISHABLE_KEY) publishable_key="$value" ;;
              SERVICE_ROLE_KEY) admin_key="$value" ;;
            esac
          done <<< "$status"
          test -n "${api_url:-}"
          test -n "${publishable_key:-}"
          test -n "${admin_key:-}"
          printf '::add-mask::%s\n' "$publishable_key"
          printf '::add-mask::%s\n' "$admin_key"
          export SUPABASE_URL="$api_url"
          export SUPABASE_PUBLISHABLE_KEY="$publishable_key"
          export SPENDWISE_LOCAL_SUPABASE_ADMIN_KEY="$admin_key"
          cd ../backend
          bash ./mvnw --batch-mode --no-transfer-progress -Dspendwise.local.supabase=true verify

      - name: Build API container
        run: docker build --pull --tag spendwise-api:${{ github.sha }} backend

      - name: Scan API container for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: spendwise-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  repository-security:
    name: Dependency, secret and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
