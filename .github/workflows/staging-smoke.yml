name: Staging smoke checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed staging endpoints
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify smoke-check logic
        run: node --test scripts/staging-smoke.test.mjs

      - name: Check deployed staging services
        run: node scripts/staging-smoke.mjs
