spring:
  application:
    name: spendwise-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI}
          jwk-set-uri: ${SUPABASE_ISSUER_URI}/.well-known/jwks.json
          audiences:
            - authenticated
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui

spendwise:
  invitation:
    base-url: ${SPENDWISE_INVITATION_BASE_URL:http://localhost:8081/invitations/accept}
    ttl: ${SPENDWISE_INVITATION_TTL:PT168H}
