spring:
  application:
    name: spendwise-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI}
          jwk-set-uri: ${SUPABASE_ISSUER_URI}/.well-known/jwks.json
          audiences:
            - authenticated
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui
